site_name: p4Radio
site_description: Setup, operation and development documentation for p4Radio
site_url: ''
repo_url: https://github.com/BillyBag2/p4Radio
repo_name: GitHub
edit_uri: ''
use_directory_urls: false
theme:
  name: readthedocs
  highlightjs: true
  navigation_depth: 3
nav:
  - Home: index.md
  - User manual: MANUAL.md
  - Board builds: ESP-IDF-BOARDS.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
extra_css:
  - style.css
