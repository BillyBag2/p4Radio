<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control - p4Radio</title>
<link rel="stylesheet" href="/navigation.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:clamp(12px,4vw,32px);background:#101827;color:#f3f6fb;font:16px system-ui,sans-serif}
main{max-width:520px;margin:auto}
h1{margin:0;font-size:1.5rem}
.panel{display:grid;gap:16px;padding:clamp(16px,5vw,32px);background:#1b2638;border:1px solid #52647f;border-radius:18px}
.readout{min-height:8rem;padding:18px;background:#101827;border-radius:12px;text-align:center}
h2{margin:0 0 8px;font-size:clamp(1.4rem,5vw,2rem);overflow-wrap:anywhere}
p{margin:0;color:#bfccde;overflow-wrap:anywhere}
#bitrate{margin-top:6px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:4px;color:#bfccde}
meter{width:100%;height:14px;accent-color:#60d6ad}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{min-height:50px;border:1px solid #52647f;border-radius:10px;background:#26374d;color:#f3f6fb;font:700 1rem system-ui;cursor:pointer}
button:hover:not(:disabled){background:#344960}
button:focus-visible{outline:3px solid #f1cf78;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
#power{background:#60d6ad;color:#10251d}
#error{color:#ffcbac}
</style>
</head>
<body>
<main>
  <h1>p4Radio Control</h1>
  <nav class="page-tabs" aria-label="Settings pages"><a href="/">Radio</a><a href="/control" aria-current="page">Control</a><a href="/stations">Stations</a><a href="/wifi">Wi-Fi</a>@ADVANCED_TAB@</nav>
  <section class="panel" aria-label="Radio controls">
    <div class="readout">
      <h2 id="station">Radio</h2>
      <p id="status" role="status">Connecting to the radio...</p>
      <p id="bitrate"></p>
    </div>
    <div class="levels">
      <label>Volume <meter id="volume" min="0" max="10" value="0"></meter></label>
      <label>Buffer <meter id="buffer" min="0" max="100" value="0"></meter></label>
    </div>
    <div class="controls">
      <button type="button" data-action="previous" disabled>&lt; Station</button>
      <button type="button" data-action="next" disabled>Station &gt;</button>
      <button type="button" data-action="quieter" disabled>&minus; Volume</button>
      <button type="button" data-action="louder" disabled>Volume +</button>
      <button type="button" data-action="tune" disabled>TUNE</button>
      <button type="button" data-action="off" id="power" disabled>OFF</button>
    </div>
    <p id="error" role="alert" hidden></p>
  </section>
</main>
<script>
const byId = id => document.getElementById(id);
const buttons = document.querySelectorAll('button[data-action]');
const power = byId('power');
const error = byId('error');
let state;
let busy = false;
let timer;

function syncButtons() {
  for (const button of buttons) {
    button.disabled = !state || busy || (state.off && button !== power);
  }
}

async function update(action) {
  if (busy && !action) return;
  clearTimeout(timer);
  // Ignore a poll response if a command was sent after it started.
  const revision = ++updateRevision;
  try {
    const options = action
      ? {method: 'POST', headers: {'X-Radio-Action': action}}
      : {cache: 'no-store'};
    const response = await fetch('/api/control', options);
    if (!response.ok) throw new Error('Request failed');
    const current = await response.json();
    if (revision !== updateRevision) return;
    state = current;
    byId('station').textContent = state.station || 'No station selected';
    if (byId('status').textContent !== state.status) byId('status').textContent = state.status;
    byId('bitrate').textContent = state.bitrate > 0 && !state.off ? state.bitrate + ' kbit/s' : '';
    byId('volume').value = state.volume;
    byId('buffer').value = state.off ? 0 : state.buffer;
    power.textContent = state.off ? 'ON' : 'OFF';
    power.dataset.action = state.off ? 'resume' : 'off';
    error.hidden = true;
  } catch {
    if (revision !== updateRevision) return;
    if (!action) state = undefined;
    error.textContent = action ? 'The radio did not confirm that action.' : 'Radio unavailable. Reconnecting...';
    error.hidden = false;
  } finally {
    if (revision === updateRevision) {
      busy = false;
      syncButtons();
      timer = setTimeout(update, 1500);
    }
  }
}

let updateRevision = 0;
for (const button of buttons) {
  button.addEventListener('click', () => {
    busy = true;
    syncButtons();
    update(button.dataset.action);
  });
}
update();
</script>
</body>
</html>
